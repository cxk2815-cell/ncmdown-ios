# 备用构建方式：装了 XcodeGen 的 Mac 上执行 `xcodegen generate` 即可重新生成工程。
name: NcmDown
options:
  bundleIdPrefix: com.ncm
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "14"
targets:
  NcmDown:
    type: application
    platform: iOS
    sources:
      - path: NcmDown
        excludes:
          - "web/**"
    resources:
      - path: NcmDown/web
        type: folder
    settings:
      base:
        INFOPLIST_FILE: NcmDown/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.ncm.downloader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
